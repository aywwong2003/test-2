<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Story Reader - Fable Forest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap');
        :root { --bg-main: #faf8f5; --text-dark: #1c1917; --amber-500: #f59e0b; }
        body { 
            background-color: var(--bg-main); 
            color: var(--text-dark); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            touch-action: pan-y;
        }
        .font-serif { font-family: 'Crimson Pro', serif; }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #loading-overlay { 
            position: fixed; inset: 0; background: var(--bg-main); z-index: 100; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 0.4s; 
        }
        
        .speaker-anim { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }

        #active-image { transition: opacity 0.4s ease, transform 0.4s ease; }

        .img-loader {
            border: 3px solid rgba(245, 158, 11, 0.1);
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased selection:bg-amber-100">

    <div id="loading-overlay">
        <div class="w-12 h-12 border-4 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
        <div id="loader-error" class="text-red-400 text-xs mt-4 hidden text-center px-6">
            <p class="font-bold mb-2 text-red-500">Could not start the story.</p>
            <p id="error-details" class="opacity-80 leading-relaxed text-left inline-block mt-2 bg-stone-100 p-4 rounded-xl border border-red-200 text-stone-800"></p>
        </div>
    </div>

    <header class="w-full bg-stone-900 py-6 px-6 relative flex items-center justify-center shadow-lg">
        <h1 id="header-title" class="text-2xl font-serif font-bold text-amber-500">Fable Forest</h1>
        <a href="index.html" class="absolute right-6 p-2 text-stone-400 hover:text-white transition-colors flex items-center gap-2 group">
            <span class="text-[10px] font-bold uppercase tracking-widest hidden md:inline opacity-0 group-hover:opacity-100 transition-opacity">Exit</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
    </header>

    <main id="swipe-area" class="max-w-4xl mx-auto px-4 py-6 select-none">
        <div class="relative w-full aspect-[4/3] md:aspect-video rounded-[2rem] overflow-hidden bg-stone-100 shadow-inner flex items-center justify-center mb-6">
            <div id="image-spinner" class="absolute hidden flex flex-col items-center gap-3">
                <div class="img-loader"></div>
                <span class="text-[10px] text-amber-600 font-bold uppercase tracking-widest">Generating Scene...</span>
            </div>
            <img id="active-image" class="w-full h-full object-cover opacity-0" src="" alt="Scene">
            <div class="absolute bottom-4 text-center w-full">
                <span id="scene-caption" class="bg-black/50 text-white text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold backdrop-blur-sm"></span>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6 bg-white p-3 rounded-2xl shadow-sm border border-stone-100">
            <div class="flex gap-1" id="lang-menu">
                <button data-lang="en" class="px-3 py-1.5 rounded-lg text-[10px] font-bold bg-amber-500 text-white shadow-sm transition-all">EN</button>
                <button data-lang="tc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500 hover:bg-stone-50 transition-all">繁 (粵)</button>
                <button data-lang="sc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500 hover:bg-stone-50 transition-all">简 (普)</button>
            </div>
            
            <button id="read-btn" class="flex items-center gap-2 px-6 py-2 bg-stone-100 hover:bg-amber-100 rounded-xl transition-all group">
                <svg id="speaker-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-stone-600 group-hover:text-amber-600"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <span id="read-btn-text" class="text-[11px] font-bold text-stone-600 uppercase tracking-widest">Listen</span>
            </button>

            <div class="flex items-center gap-4">
                <button id="prev-btn" class="p-3 text-stone-400 hover:text-amber-600 disabled:opacity-10 transition-colors">&larr;</button>
                <span id="scene-index" class="text-[11px] font-bold font-mono text-stone-400">01 / --</span>
                <button id="next-btn" class="p-3 text-stone-400 hover:text-amber-600 disabled:opacity-10 transition-colors">&rarr;</button>
            </div>
        </div>

        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-stone-100 min-h-[250px] flex flex-col justify-center mb-8 relative transition-all">
            <div id="narrative-text" class="text-lg md:text-xl font-serif text-stone-800 leading-relaxed italic"></div>
        </div>

        <div class="relative h-1.5 bg-stone-200 rounded-full overflow-hidden">
            <div id="scroll-bar" class="absolute h-full bg-amber-500 transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
    </main>

    <script>
        // Key is handled by environment. Setting to empty string is correct.
        const apiKey = ""; 
        let currentStory = []; 
        let state = { current: 0, lang: 'en', isPlaying: false, currentAudio: null, storyPath: "" };
        const generatedImages = {};

        const urlParams = new URLSearchParams(window.location.search);
        state.storyPath = decodeURIComponent(urlParams.get('story') || 'clever-fox').trim();

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                    if (response.status !== 429 && response.status < 500) {
                        const errorBody = await response.text();
                        console.error(`API Error ${response.status}: ${errorBody}`);
                        break;
                    }
                } catch (e) {
                    console.error(`Fetch attempt ${i+1} failed:`, e);
                }
                await new Promise(r => setTimeout(r, backoff * Math.pow(2, i)));
            }
            throw new Error("API request failed after retries. Check console for details.");
        }

        async function generateImage(promptText) {
            const spinner = document.getElementById('image-spinner');
            spinner.classList.remove('hidden');
            
            const style = "Whimsical watercolor storybook illustration, soft textures, pastel colors, professional children's book art style, high quality.";
            const fullPrompt = `${promptText}. ${style}`;

            try {
                const result = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: fullPrompt }],
                        parameters: { sampleCount: 1 }
                    })
                });
                
                if (result && result.predictions && result.predictions[0]) {
                    const b64 = result.predictions[0].bytesBase64Encoded;
                    return `data:image/png;base64,${b64}`;
                }
                return null;
            } catch (error) {
                console.error("Image generation failed", error);
                return null;
            } finally {
                spinner.classList.add('hidden');
            }
        }

        async function updateScene(idx) {
            if (!currentStory || !currentStory[idx]) return;
            stopAudio();
            state.current = idx;
            const data = currentStory[idx];
            const img = document.getElementById('active-image');
            
            document.getElementById('narrative-text').innerHTML = `<div class="fade-in">${data[state.lang]}</div>`;
            document.getElementById('scene-caption').innerText = data.caption || "";
            document.getElementById('scene-index').innerText = `${String(idx + 1).padStart(2, '0')} / ${String(currentStory.length).padStart(2, '0')}`;
            document.getElementById('scroll-bar').style.width = `${((idx + 1) / currentStory.length) * 100}%`;
            
            img.style.opacity = 0;

            if (generatedImages[idx]) {
                img.src = generatedImages[idx];
                img.style.opacity = 1;
            } else {
                const base = (state.storyPath && state.storyPath !== '.') ? `${state.storyPath}/` : '';
                const primaryPath = `${base}${data.img}`;
                const secondaryPath = primaryPath.replace('.png', '.jpg');
                
                const tryLoad = (path) => {
                    return new Promise((resolve, reject) => {
                        const tImg = new Image();
                        tImg.onload = () => resolve(path);
                        tImg.onerror = reject;
                        tImg.src = path;
                    });
                };

                try {
                    const successfulPath = await tryLoad(secondaryPath).catch(() => tryLoad(primaryPath));
                    img.src = successfulPath;
                    img.style.opacity = 1;
                } catch (e) {
                    const aiImg = await generateImage(data.en);
                    if (aiImg) {
                        generatedImages[idx] = aiImg;
                        img.src = aiImg;
                        img.style.opacity = 1;
                    } else {
                        img.src = `https://placehold.co/600x400/f59e0b/white?text=Scene+${idx+1}`;
                        img.style.opacity = 1;
                    }
                }
            }
        }

        function stopAudio() {
            state.isPlaying = false;
            document.getElementById('read-btn-text').innerText = "Listen";
            document.getElementById('speaker-icon').classList.remove('speaker-anim');
            if (state.currentAudio) { 
                state.currentAudio.pause(); 
                state.currentAudio = null; 
            }
        }

        async function speakText(text, lang) {
            if (state.isPlaying) { stopAudio(); return; }
            state.isPlaying = true;
            document.getElementById('read-btn-text').innerText = "Generating...";
            document.getElementById('speaker-icon').classList.add('speaker-anim');

            try {
                let voiceName = lang === 'sc' ? "Algieba" : "Kore";
                const result = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text }] }],
                        generationConfig: { 
                            responseModalities: ["AUDIO"], 
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } 
                        }
                    })
                });

                const audioPart = result.candidates[0].content.parts.find(p => p.inlineData);
                if (!audioPart) throw new Error("No audio data in response");

                const audioData = audioPart.inlineData.data;
                const binaryString = atob(audioData);
                const bytes = new Int16Array(binaryString.length / 2);
                for (let j = 0; j < binaryString.length; j += 2) {
                    bytes[j / 2] = (binaryString.charCodeAt(j + 1) << 8) | binaryString.charCodeAt(j);
                }
                
                const pcmToWav = (pcm, sr) => {
                    const buffer = new ArrayBuffer(44 + pcm.length * 2);
                    const view = new DataView(buffer);
                    const writeString = (offset, string) => {
                        for (let i = 0; i < string.length; i++) {
                            view.setUint8(offset + i, string.charCodeAt(i));
                        }
                    };
                    writeString(0, 'RIFF');
                    view.setUint32(4, 32 + pcm.length * 2, true);
                    writeString(8, 'WAVE');
                    writeString(12, 'fmt ');
                    view.setUint32(16, 16, true);
                    view.setUint16(20, 1, true); 
                    view.setUint16(22, 1, true); 
                    view.setUint32(24, sr, true);
                    view.setUint32(28, sr * 2, true);
                    view.setUint16(32, 2, true);
                    view.setUint16(34, 16, true);
                    writeString(36, 'data');
                    view.setUint32(40, pcm.length * 2, true);
                    for (let i = 0; i < pcm.length; i++) {
                        view.setInt16(44 + i * 2, pcm[i], true);
                    }
                    return new Blob([buffer], { type: 'audio/wav' });
                };

                const blob = pcmToWav(bytes, 24000);
                const url = URL.createObjectURL(blob);
                state.currentAudio = new Audio(url);
                state.currentAudio.onplay = () => {
                    document.getElementById('read-btn-text').innerText = "Playing...";
                };
                state.currentAudio.onended = stopAudio;
                state.currentAudio.play().catch(e => {
                    console.error("Audio playback blocked", e);
                    stopAudio();
                });
            } catch (e) {
                console.error("Speech generation failed", e);
                stopAudio();
            }
        }

        async function initApp() {
            try {
                const script = document.createElement('script');
                script.src = `${state.storyPath}/story-data.js`;
                script.onload = () => {
                    currentStory = window.storyData || (typeof storyData !== 'undefined' ? storyData : []);
                    if (currentStory && currentStory.length > 0) {
                        updateScene(0);
                        document.getElementById('loading-overlay').style.opacity = '0';
                        setTimeout(() => document.getElementById('loading-overlay').remove(), 400);
                    } else {
                        handleInitError("Story data is empty or undefined.");
                    }
                };
                script.onerror = () => {
                    currentStory = (typeof storyData !== 'undefined') ? storyData : [];
                    if (currentStory.length > 0) {
                        updateScene(0);
                        document.getElementById('loading-overlay').style.opacity = '0';
                        setTimeout(() => document.getElementById('loading-overlay').remove(), 400);
                    } else {
                        handleInitError("Could not load story-data.js from path: " + state.storyPath);
                    }
                }
                document.head.appendChild(script);
            } catch (err) {
                handleInitError(err.message);
            }
        }

        function handleInitError(msg) {
            document.getElementById('loader-error').classList.remove('hidden');
            document.getElementById('error-details').innerText = msg;
        }

        document.getElementById('next-btn').onclick = () => {
            if (state.current < currentStory.length - 1) updateScene(state.current + 1);
        };
        document.getElementById('prev-btn').onclick = () => {
            if (state.current > 0) updateScene(state.current - 1);
        };
        
        document.getElementById('lang-menu').onclick = (e) => {
            if (e.target.dataset.lang) {
                state.lang = e.target.dataset.lang;
                document.querySelectorAll('#lang-menu button').forEach(b => b.className = "px-3 py-1.5 rounded-lg text-stone-500 font-bold text-[10px] hover:bg-stone-50 transition-all");
                e.target.className = "px-3 py-1.5 rounded-lg bg-amber-500 text-white font-bold text-[10px] shadow-sm";
                updateScene(state.current);
            }
        };
        
        document.getElementById('read-btn').onclick = () => {
            if (currentStory[state.current]) {
                speakText(currentStory[state.current][state.lang], state.lang);
            }
        };

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
