<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Reader - Fable Forest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap');
        :root { --bg-main: #faf8f5; --text-dark: #1c1917; --amber-500: #f59e0b; }
        body { background-color: var(--bg-main); color: var(--text-dark); font-family: 'Inter', sans-serif; overflow-x: hidden; touch-action: pan-y; }
        .font-serif { font-family: 'Crimson Pro', serif; }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #launch-pad { position: fixed; inset: 0; background: var(--text-dark); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s; }
        .speaker-anim { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="antialiased selection:bg-amber-100">

    <div id="launch-pad">
        <h1 id="intro-title" class="text-4xl font-serif font-bold text-amber-500 mb-2 text-center px-4">Loading Story...</h1>
        <p class="text-stone-500 text-[10px] uppercase tracking-[0.3em] mb-10">An Interactive Fable</p>
        <button id="start-btn" class="hidden px-10 py-4 bg-amber-600 text-white font-bold rounded-full shadow-2xl active:scale-95 transition-all">START JOURNEY</button>
        <div id="loader-error" class="text-red-400 text-xs mt-4 hidden text-center px-6">
            <p class="font-bold mb-2 text-red-500">Could not start the story.</p>
            <p id="error-details" class="opacity-80 leading-relaxed text-left inline-block mt-2 bg-stone-900 p-4 rounded-xl border border-red-900"></p>
        </div>
    </div>

    <header class="w-full bg-stone-900 py-8 px-6 text-center">
        <h1 id="header-title" class="text-2xl font-serif font-bold text-amber-500">Fable Forest</h1>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6" id="swipe-container">
        <!-- Visual Window -->
        <div class="relative w-full aspect-[4/3] md:aspect-video rounded-[2rem] overflow-hidden bg-stone-100 shadow-inner flex items-center justify-center mb-6">
            <img id="active-image" class="w-48 h-48 md:w-64 md:h-64 object-cover rounded-3xl shadow-2xl transition-opacity duration-500 opacity-0" src="" alt="Scene">
            <div class="absolute bottom-4 text-center w-full">
                <span id="scene-caption" class="bg-black/50 text-white text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold backdrop-blur-sm"></span>
            </div>
        </div>

        <!-- Interface Controls -->
        <div class="flex justify-between items-center mb-6 bg-white p-2 rounded-2xl shadow-sm border border-stone-100">
            <div class="flex gap-1" id="lang-menu">
                <button data-lang="en" class="px-3 py-1.5 rounded-lg text-[10px] font-bold bg-amber-500 text-white shadow-sm">EN</button>
                <button data-lang="tc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500">繁 (粵)</button>
                <button data-lang="sc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500">简 (普)</button>
            </div>
            
            <button id="read-btn" class="flex items-center gap-2 px-4 py-1.5 bg-stone-100 hover:bg-amber-100 rounded-lg transition-colors group">
                <svg id="speaker-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-stone-600 group-hover:text-amber-600"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <span id="read-btn-text" class="text-[10px] font-bold text-stone-600 uppercase tracking-tighter">Listen</span>
            </button>

            <div class="flex items-center gap-4">
                <button id="prev-btn" class="p-2 text-stone-400 hover:text-amber-600 disabled:opacity-20">&larr;</button>
                <span id="scene-index" class="text-[10px] font-bold font-mono">01 / --</span>
                <button id="next-btn" class="p-2 text-stone-400 hover:text-amber-600 disabled:opacity-20">&rarr;</button>
            </div>
        </div>

        <div id="api-error-msg" class="hidden bg-red-50 text-red-600 text-[10px] p-2 rounded-lg mb-6 border border-red-100 font-bold text-center"></div>

        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-stone-100 min-h-[300px] flex flex-col justify-center mb-8 relative">
            <div id="narrative-text" class="text-lg md:text-xl font-serif text-stone-800 leading-relaxed italic mb-6"></div>
            <div id="share-section" class="hidden flex flex-col items-center border-t border-stone-100 pt-6 animate-pulse">
                <p class="text-[9px] uppercase tracking-widest text-stone-400 mb-4 font-bold">Share this journey</p>
                <img id="qr-code" class="w-24 h-24 rounded-lg border-4 border-white shadow-md" src="" alt="QR Code">
            </div>
        </div>

        <div class="relative h-1 bg-stone-200 rounded-full overflow-hidden">
            <div id="scroll-bar" class="absolute h-full bg-amber-500 transition-all duration-500" style="width: 0%"></div>
        </div>
    </main>

    <script>
        const apiKey = "AIzaSyAyJmBsKfhjXR1vU7J4urIyCLMrjGX9jqs"; 
        // Renamed to `currentStory` to prevent redeclaration conflicts if the user uses `let storyData` in their js file.
        let currentStory = []; 
        let state = { current: 0, lang: 'en', isPlaying: false, currentAudio: null, storyPath: "" };

        // 1. GET URL PARAMETERS
        const urlParams = new URLSearchParams(window.location.search);
        const rawStoryId = urlParams.get('story') || 'clever-fox';
        state.storyPath = decodeURIComponent(rawStoryId).trim();

        // 2. DYNAMICALLY LOAD DATA
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = () => resolve();
                // We add a generic network error message here
                script.onerror = () => reject(new Error(`Failed to load the file (Network/Path Error).`));
                document.head.appendChild(script);
            });
        }

        async function initApp() {
            try {
                const dataPath = `${state.storyPath}/story-data.js`;
                await loadScript(dataPath);
                
                // Once script is loaded, look for the data the user provided
                let foundData = null;
                if (typeof window.storyData !== 'undefined') foundData = window.storyData;
                else if (typeof storyData !== 'undefined') foundData = storyData;

                if (foundData && Array.isArray(foundData)) {
                    currentStory = foundData;
                    document.getElementById('intro-title').innerText = state.storyPath.replace(/[-/]/g, ' ').toUpperCase();
                    document.getElementById('start-btn').classList.remove('hidden');
                } else {
                    throw new Error("File was found, but the <b>storyData</b> array is missing or incorrect.");
                }
            } catch (err) {
                console.error(err);
                document.getElementById('intro-title').innerText = "Loading Error";
                document.getElementById('loader-error').classList.remove('hidden');
                document.getElementById('error-details').innerHTML = `
                    <span class="text-amber-500 font-mono text-[10px] uppercase">Attempted Path:</span><br>
                    ${state.storyPath}/story-data.js<br><br>
                    <span class="text-amber-500 font-mono text-[10px] uppercase">Details:</span><br>
                    ${err.message}<br><br>
                    <span class="text-amber-500 font-mono text-[10px] uppercase">How to fix:</span><br>
                    Make sure your story-data.js file starts exactly with:<br>
                    <code class="text-stone-300 block mt-1">var storyData = [ ... ];</code>
                `;
            }
        }

        // 3. UI LOGIC
        function updateScene(idx) {
            if (!currentStory[idx]) return;
            resetAudioState();
            state.current = idx;
            const data = currentStory[idx];
            const img = document.getElementById('active-image');
            
            document.getElementById('read-btn').classList.toggle('hidden', state.lang === 'tc');
            document.getElementById('narrative-text').innerHTML = `<p class="fade-in">${data[state.lang]}</p>`;
            document.getElementById('scene-caption').innerText = data.caption || "";
            document.getElementById('scene-index').innerText = `${String(idx + 1).padStart(2, '0')} / ${String(currentStory.length).padStart(2, '0')}`;
            document.getElementById('scroll-bar').style.width = `${((idx + 1) / currentStory.length) * 100}%`;
            document.getElementById('prev-btn').disabled = idx === 0;
            document.getElementById('next-btn').disabled = idx === currentStory.length - 1;
            
            if (idx === currentStory.length - 1) {
                document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}`;
                document.getElementById('share-section').classList.remove('hidden');
            } else {
                document.getElementById('share-section').classList.add('hidden');
            }

            setTimeout(() => {
                img.style.opacity = 0;
                img.src = `${state.storyPath}/${data.img}`;
                img.onload = () => img.style.opacity = 1;
                img.onerror = () => { 
                    img.src = `https://placehold.co/400x400?text=Scene+${idx+1}`; 
                    img.style.opacity = 1; 
                };
            }, 150);
        }

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function speakText(text, lang) {
            if (state.isPlaying) { resetAudioState(); return; }
            const btnText = document.getElementById('read-btn-text');
            const icon = document.getElementById('speaker-icon');
            let voiceName = lang === 'sc' ? "Algieba" : "Kore";
            state.isPlaying = true;
            btnText.innerText = "Connecting...";
            icon.classList.add('speaker-anim');
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text }] }],
                        generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } }
                    })
                });
                const result = await response.json();
                const audioData = result.candidates[0].content.parts[0].inlineData;
                const binaryString = atob(audioData.data);
                const bytes = new Int16Array(binaryString.length / 2);
                for (let j = 0; j < binaryString.length; j += 2) bytes[j / 2] = (binaryString.charCodeAt(j + 1) << 8) | binaryString.charCodeAt(j);
                const audioUrl = URL.createObjectURL(pcmToWav(bytes, 24000));
                state.currentAudio = new Audio(audioUrl);
                state.currentAudio.onended = resetAudioState;
                state.currentAudio.play();
                btnText.innerText = "Playing";
            } catch (e) { resetAudioState(); }
        }

        function resetAudioState() {
            state.isPlaying = false;
            document.getElementById('read-btn-text').innerText = "Listen";
            document.getElementById('speaker-icon').classList.remove('speaker-anim');
            if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
        }

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('launch-pad').style.opacity = 0;
            setTimeout(() => { document.getElementById('launch-pad').remove(); updateScene(0); }, 600);
        };
        document.getElementById('next-btn').onclick = () => updateScene(state.current + 1);
        document.getElementById('prev-btn').onclick = () => updateScene(state.current - 1);
        document.getElementById('lang-menu').onclick = (e) => {
            if (e.target.dataset.lang) {
                state.lang = e.target.dataset.lang;
                document.querySelectorAll('#lang-menu button').forEach(b => b.className = "px-3 py-1.5 rounded-lg text-stone-500 font-bold text-[10px]");
                e.target.className = "px-3 py-1.5 rounded-lg bg-amber-500 text-white font-bold text-[10px]";
                updateScene(state.current);
            }
        };
        document.getElementById('read-btn').onclick = () => speakText(currentStory[state.current][state.lang], state.lang);

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
