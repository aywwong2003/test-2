<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fable Forest - Story Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #fafaf9; color: #1c1917; }
        .font-serif { font-family: 'Crimson Pro', serif; }
        .speaker-active { animation: pulse 1.5s infinite; color: #f59e0b; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-white border-b border-stone-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center text-white font-bold">F</div>
            <h1 id="title-display" class="font-serif text-xl font-bold text-stone-800">Fable Forest</h1>
        </div>
        <button onclick="window.location.href='index.html'" class="text-stone-400 hover:text-stone-600 p-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </button>
    </nav>

    <main class="flex-grow max-w-3xl mx-auto w-full p-6 md:p-12 space-y-12">
        
        <!-- Image Container -->
        <div class="aspect-video bg-stone-200 rounded-3xl overflow-hidden shadow-inner flex items-center justify-center relative">
             <img id="story-image" class="w-full h-full object-cover hidden" alt="Story Illustration">
             <div id="image-placeholder" class="flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
             </div>
        </div>

        <div class="space-y-8">
            <!-- Controls Bar: Language, Navigation, and Listen -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 bg-white p-4 rounded-3xl border border-stone-100 shadow-sm">
                <!-- Left Section: Lang Picker -->
                <div class="flex bg-stone-100 p-1 rounded-xl" id="lang-picker">
                    <button data-lang="en" class="lang-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm text-stone-900 transition-all">EN</button>
                    <button data-lang="tc" class="lang-btn px-4 py-1.5 rounded-lg text-xs font-bold text-stone-500 hover:text-stone-900 transition-all">繁體</button>
                    <button data-lang="sc" class="lang-btn px-4 py-1.5 rounded-lg text-xs font-bold text-stone-500 hover:text-stone-900 transition-all">简体</button>
                </div>

                <!-- Right Section: Navigation + Audio -->
                <div class="flex items-center gap-4">
                    <!-- Integrated Navigation Arrows and Counter -->
                    <div class="flex items-center gap-2 bg-stone-50 p-1 rounded-full border border-stone-100">
                        <button id="prev-btn" class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-stone-400 hover:text-amber-600 shadow-sm disabled:opacity-0 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        
                        <span id="page-counter" class="text-[10px] font-bold text-stone-500 tracking-tighter px-2 min-w-[70px] text-center">PAGE 1 / 6</span>
                        
                        <button id="next-btn" class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-stone-400 hover:text-amber-600 shadow-sm disabled:opacity-0 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>

                    <!-- Audio Button -->
                    <button id="audio-btn" class="flex items-center gap-3 px-6 py-3 bg-stone-900 text-white rounded-full hover:bg-stone-800 transition-all shadow-md active:scale-95 group">
                        <svg id="speaker-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        <span id="audio-status" class="text-xs font-bold uppercase tracking-widest">Listen</span>
                    </button>
                </div>
            </div>

            <!-- Text Display -->
            <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-stone-100 min-h-[200px] flex items-center">
                <p id="story-text" class="text-xl md:text-2xl font-serif text-stone-800 leading-relaxed text-center w-full"></p>
            </div>
        </div>
    </main>

    <script>
        const apiKey = "AIzaSyAn0uzAGSJYsAodyRK97VE-qvPbJ7SSQlw"; 

        let state = {
            key: new URLSearchParams(window.location.search).get('story') || 'clever-fox',
            idx: 0,
            lang: 'en',
            audio: null,
            data: []
        };

        function loadStoryData() {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                const path = `${state.key}/story-data.js`;
                script.src = path;
                script.onload = () => {
                    if (typeof storyData !== 'undefined') {
                        state.data = storyData;
                        resolve();
                    }
                };
                script.onerror = () => {
                    const fallback = 'story-data.js';
                    const fallbackScript = document.createElement('script');
                    fallbackScript.src = fallback;
                    fallbackScript.onload = () => {
                        if (typeof storyData !== 'undefined') {
                            state.data = storyData;
                            resolve();
                        }
                    };
                    document.head.appendChild(fallbackScript);
                };
                document.head.appendChild(script);
            });
        }

        async function fetchTTS(text, lang) {
            const voice = (lang === 'sc' || lang === 'tc') ? "Algieba" : "Kore";
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text }] }],
                    generationConfig: { 
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                    }
                })
            });
            return await response.json();
        }

        function pcmToWav(pcmData, sampleRate = 24000) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); 
            view.setUint16(22, 1, true); 
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function speak() {
            if (state.audio) {
                state.audio.pause();
                state.audio = null;
                updateAudioUI(false);
                return;
            }
            const status = document.getElementById('audio-status');
            status.innerText = "Loading...";
            updateAudioUI(true);
            try {
                if (!state.data || !state.data[state.idx]) throw new Error("No data");
                const text = state.data[state.idx][state.lang];
                const res = await fetchTTS(text, state.lang);
                const part = res.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                const base64 = part?.inlineData?.data;
                if (!base64) throw new Error("No audio data");
                const binary = atob(base64);
                const pcm = new Int16Array(binary.length / 2);
                for (let i = 0; i < binary.length; i += 2) {
                    pcm[i / 2] = (binary.charCodeAt(i + 1) << 8) | binary.charCodeAt(i);
                }
                const blob = pcmToWav(pcm);
                const audioUrl = URL.createObjectURL(blob);
                state.audio = new Audio(audioUrl);
                state.audio.onplay = () => status.innerText = "Playing";
                state.audio.onended = () => { state.audio = null; updateAudioUI(false); URL.revokeObjectURL(audioUrl); };
                state.audio.play();
            } catch (e) {
                status.innerText = "Error";
                setTimeout(() => updateAudioUI(false), 2000);
            }
        }

        function updateAudioUI(playing) {
            const status = document.getElementById('audio-status');
            const icon = document.getElementById('speaker-icon');
            if (playing) icon.classList.add('speaker-active');
            else { icon.classList.remove('speaker-active'); status.innerText = "Listen"; }
        }

        function render() {
            if (!state.data || state.data.length === 0) return;
            if (state.audio) { state.audio.pause(); state.audio = null; updateAudioUI(false); }
            const scene = state.data[state.idx];
            document.getElementById('story-text').innerText = scene[state.lang];
            const rawTitle = state.key.replace(/-/g, ' ');
            document.getElementById('title-display').innerText = rawTitle.charAt(0).toUpperCase() + rawTitle.slice(1);
            document.getElementById('page-counter').innerText = `PAGE ${state.idx + 1} / ${state.data.length}`;
            document.getElementById('prev-btn').disabled = state.idx === 0;
            document.getElementById('next-btn').disabled = state.idx === state.data.length - 1;
            const imgEl = document.getElementById('story-image');
            const placeholder = document.getElementById('image-placeholder');
            if (scene.img) {
                const subDir = `${state.key}/`;
                imgEl.src = subDir + scene.img;
                imgEl.classList.remove('hidden');
                placeholder.classList.add('hidden');
                imgEl.onerror = () => { imgEl.src = scene.img; imgEl.onerror = null; };
            } else {
                imgEl.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        document.getElementById('next-btn').onclick = () => { if(state.idx < state.data.length-1) { state.idx++; render(); }};
        document.getElementById('prev-btn').onclick = () => { if(state.idx > 0) { state.idx--; render(); }};
        document.getElementById('audio-btn').onclick = speak;
        document.getElementById('lang-picker').onclick = (e) => {
            if (e.target.dataset.lang) {
                state.lang = e.target.dataset.lang;
                document.querySelectorAll('.lang-btn').forEach(b => {
                    b.className = "lang-btn px-4 py-1.5 rounded-lg text-xs font-bold text-stone-500 hover:text-stone-900 transition-all";
                });
                e.target.className = "lang-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm text-stone-900 transition-all";
                render();
            }
        };

        loadStoryData().then(render);
    </script>
</body>
</html>
