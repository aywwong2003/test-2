<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ember Watcher - A Forest Saga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap');
        :root { --bg-main: #faf8f5; --text-dark: #1c1917; --amber-500: #f59e0b; }
        body { background-color: var(--bg-main); color: var(--text-dark); font-family: 'Inter', sans-serif; overflow-x: hidden; touch-action: pan-y; }
        .font-serif { font-family: 'Crimson Pro', serif; }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #launch-pad { position: fixed; inset: 0; background: var(--text-dark); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s; }
    </style>
</head>
<body class="antialiased selection:bg-amber-100">

    <div id="launch-pad">
        <h1 class="text-4xl font-serif font-bold text-amber-500 mb-2">The Ember Watcher</h1>
        <p class="text-stone-500 text-[10px] uppercase tracking-[0.3em] mb-10">An Environmental Saga</p>
        <button id="start-btn" class="px-10 py-4 bg-amber-600 text-white font-bold rounded-full shadow-2xl active:scale-95 transition-all">ENTER THE WOODS</button>
    </div>

    <header class="w-full bg-stone-900 py-8 px-6 text-center">
        <h1 class="text-2xl font-serif font-bold text-amber-500">The Ember Watcher</h1>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6" id="swipe-container">
        <!-- Visual Viewport (Smaller 1/4 size feel) -->
        <div class="relative w-full aspect-[4/3] md:aspect-video rounded-[2rem] overflow-hidden bg-stone-100 shadow-inner flex items-center justify-center mb-6">
            <!-- The Image is constrained to be small (1/4 of container area effectively) -->
            <img id="active-image" class="w-48 h-48 md:w-64 md:h-64 object-cover rounded-3xl shadow-2xl transition-opacity duration-500 opacity-0" src="" alt="Scene">
            <div class="absolute bottom-4 text-center w-full">
                <span id="scene-caption" class="bg-black/50 text-white text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold backdrop-blur-sm"></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-between items-center mb-6 bg-white p-2 rounded-2xl shadow-sm border border-stone-100">
            <div class="flex gap-1" id="lang-menu">
                <button data-lang="en" class="px-3 py-1.5 rounded-lg text-[10px] font-bold bg-amber-500 text-white shadow-sm">EN</button>
                <button data-lang="tc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500">繁</button>
                <button data-lang="sc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500">简</button>
            </div>
            <div class="flex items-center gap-4">
                <button id="prev-btn" class="p-2 text-stone-400 hover:text-amber-600 disabled:opacity-20">&larr;</button>
                <span id="scene-index" class="text-[10px] font-bold font-mono">01 / 06</span>
                <button id="next-btn" class="p-2 text-stone-400 hover:text-amber-600 disabled:opacity-20">&rarr;</button>
            </div>
        </div>

        <!-- Story Text -->
        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-stone-100 min-h-[300px] flex flex-col justify-center mb-8">
            <div id="narrative-text" class="text-lg md:text-xl font-serif text-stone-800 leading-relaxed italic mb-6"></div>
            
            <!-- QR Code Section (Hidden until End) -->
            <div id="share-section" class="hidden flex flex-col items-center border-t border-stone-100 pt-6 animate-pulse">
                <p class="text-[9px] uppercase tracking-widest text-stone-400 mb-4 font-bold">Share this journey</p>
                <img id="qr-code" class="w-24 h-24 rounded-lg border-4 border-white shadow-md" src="" alt="QR Code">
                <p class="text-[10px] text-stone-500 mt-2 font-medium">Scan to read with a friend</p>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="relative h-1 bg-stone-200 rounded-full overflow-hidden">
            <div id="scroll-bar" class="absolute h-full bg-amber-500 transition-all duration-500" style="width: 16.6%"></div>
        </div>
    </main>

    <footer class="py-10 text-center text-stone-400 text-[9px] uppercase tracking-widest">
        Swipe or Use Arrows to Navigate
    </footer>

    <script>
        const storyData = [
            {
                en: "In the heart of the Whispering Woods, Silas the fox didn't just hunt; he observed. He was fascinated by the two-legged 'Walkers' and their clicking technology, especially the boxes that birthed 'The Red Flower.' While others honed their pounce, Silas analyzed the patterns of those who brought the flame.",
                tc: "在低語森林的核心地帶，狐狸西拉斯不只是捕獵；他還在觀察。他著迷於那些行走者及其技術，尤其是那些能孕育出「紅花」的盒子。當其他狐狸磨練捕獵技巧時，西拉斯卻在分析那些帶來火焰的人。",
                sc: "在低语森林的核心地带，狐狸西拉斯不只是捕猎；他还在观察。他着迷于那些行走者及其技术，尤其是那些能孕育出“红花”的盒子。当其他狐狸磨练捕猎技巧时，西拉斯却在分析那些带来火焰的人。",
                img: "Photo1.png", caption: "The Observer"
            },
            {
                en: "August brought a sweltering heat that turned the woods into a tinderbox. Silas tracked a group of campers who left behind a circle of smooth river stones. Deep within the white ash they abandoned, a single, stubborn ember pulsed with residual energy, waiting for a breath of wind to catalyze disaster.",
                tc: "八月悶熱難耐，乾枯的植被就像個火藥桶。西拉斯追蹤了一群營地使用者，他們留下了一個由鵝卵石組成的圈。在他們遺棄的白灰深處，一顆頑強的餘燼正跳動著殘餘能量，等待風來催化災難。",
                sc: "八月闷热难耐，干枯的植被就像个火药桶。西拉斯追踪了一群营地使用者，他们留下了一个由鹅卵石组成的圈。在他们遗弃的白灰深处，一颗顽强的余烬正跳动着残余能量，等待风来催化灾难。",
                img: "Photo2.png", caption: "The Pulse"
            },
            {
                en: "The equilibrium shattered when a dry leaf danced into the containment circle. It ignited instantly. Small, orange tongues of flame began licking at the desiccated pine needles, heading straight for the Great Cedar, the ancient heart of the forest. The threat was no longer theoretical.",
                tc: "當一片枯葉舞進圈中時，平衡崩潰了。它瞬間被點燃。橙色的小火舌開始舔食乾枯的松針，直衝向大雪松——森林古老的心臟。威脅不再是理論上的。",
                sc: "当一片枯叶舞进圈中时，平衡崩溃了。它瞬间被点燃。橙色的小火舌开始舔食干枯的松针，直冲向大雪松——森林古老的心脏。威胁不再是理论上的。",
                img: "scene3.png", caption: "The Ignition"
            },
            {
                en: "Silas didn't waste time on useless barking. His plan required swift navigation to the Dry Creek. With frantic paws, he clawed through the surface dust to reach the damp silt and heavy clay hidden beneath—the only effective barrier against a heat of this magnitude.",
                tc: "西拉斯並沒有浪費時間在無用的吠叫上。他的計劃需要快速到達乾涸溪。他瘋狂地挖開地表塵土，尋找隱藏在底下的潮濕淤泥和沈重黏土——這是對抗這種程度熱量的唯一有效屏障。",
                sc: "西拉斯并没有浪费时间在无用的吠叫上。他的计划需要快速到达干涸溪。他疯狂地挖开地表尘土，寻找隐藏在底下的潮湿淤泥和沉重黏土——这是对抗这种程度热量的唯一有效屏障。",
                img: "scene4.png", caption: "The Resource"
            },
            {
                en: "Muscles straining, Silas dragged a heavy, mud-soaked canvas left by the campers towards the heat. With a powerful heave, he flipped the mud-soaked fabric directly over the fire's heart, using kinetic energy and the smothering mud to achieve immediate containment.",
                tc: "西拉斯肌肉緊繃，將一塊浸透泥水的沈重帆布拖向熱源。他猛力一甩，將浸透泥水的織物翻蓋在火源核心上，利用動能和窒息性泥土實現立即封鎖。",
                sc: "西拉斯肌肉紧绷，将一块浸透泥水的沉重帆布拖向热源。他猛力一甩，将浸透泥水的织物翻盖在火源核心上，利用动能和窒息性泥土实现立即封锁。",
                img: "scene5.png", caption: "The Smothering"
            },
            {
                en: "By dawn, the Great Cedar stood unharmed. Silas rested by the stream, cooling his sore paws in the water. He had neutralized the crisis not with teeth and claws, but with a strategy of environmental resource allocation and consequence modeling.",
                tc: "黎明時分，大雪松安然無恙。西拉斯在溪邊休息，在水中冷卻酸痛的爪子。他不是靠牙齒和利爪，而是靠資源分配和後果建模的策略化解了危機。",
                sc: "黎明时分，大雪松安然无恙。西拉斯在溪边休息，在水中冷却酸痛的爪子。他不是靠牙齿和利爪，而是靠资源分配和后果建模的策略化解了危机。",
                img: "scene6.png", caption: "The Success"
            }
        ];

        let state = { current: 0, lang: 'en', touchStartX: 0, touchEndX: 0 };

        // Swipe Handlers
        const container = document.getElementById('swipe-container');
        container.addEventListener('touchstart', e => { state.touchStartX = e.changedTouches[0].screenX; });
        container.addEventListener('touchend', e => {
            state.touchEndX = e.changedTouches[0].screenX;
            const diff = state.touchStartX - state.touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && state.current < 5) updateScene(state.current + 1);
                else if (diff < 0 && state.current > 0) updateScene(state.current - 1);
            }
        });

        function updateScene(idx) {
            state.current = idx;
            const data = storyData[idx];
            const img = document.getElementById('active-image');
            
            img.style.opacity = 0;
            document.getElementById('narrative-text').innerHTML = `<p class="fade-in">${data[state.lang]}</p>`;
            document.getElementById('scene-caption').innerText = data.caption;
            document.getElementById('scene-index').innerText = `${String(idx + 1).padStart(2, '0')} / 06`;
            document.getElementById('scroll-bar').style.width = `${((idx + 1) / 6) * 100}%`;
            document.getElementById('prev-btn').disabled = idx === 0;
            document.getElementById('next-btn').disabled = idx === 5;

            // QR Code Logic: Only show on the final scene
            const shareSection = document.getElementById('share-section');
            if (idx === 5) {
                const currentUrl = encodeURIComponent(window.location.href);
                // Using QRServer API: https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=YOUR_LINK
                document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${currentUrl}`;
                shareSection.classList.remove('hidden');
            } else {
                shareSection.classList.add('hidden');
            }

            setTimeout(() => {
                img.src = data.img;
                img.onload = () => img.style.opacity = 1;
                // Fallback for broken local files in preview
                img.onerror = () => { img.src = "https://via.placeholder.com/400x400?text=Please+Save+Scene+" + (idx+1); img.style.opacity = 1; };
            }, 200);
        }

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('launch-pad').style.opacity = 0;
            setTimeout(() => { document.getElementById('launch-pad').remove(); updateScene(0); }, 600);
        };

        document.getElementById('next-btn').onclick = () => updateScene(state.current + 1);
        document.getElementById('prev-btn').onclick = () => updateScene(state.current - 1);
        document.getElementById('lang-menu').onclick = (e) => {
            if (e.target.dataset.lang) {
                state.lang = e.target.dataset.lang;
                document.querySelectorAll('#lang-menu button').forEach(b => {
                    b.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500";
                });
                e.target.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold bg-amber-500 text-white shadow-sm";
                updateScene(state.current);
            }
        };
    </script>
</body>
</html>
