<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ember Watcher - A Forest Saga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap');
        :root { --bg-main: #faf8f5; --text-dark: #1c1917; --amber-500: #f59e0b; }
        body { background-color: var(--bg-main); color: var(--text-dark); font-family: 'Inter', sans-serif; overflow-x: hidden; touch-action: pan-y; }
        .font-serif { font-family: 'Crimson Pro', serif; }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #launch-pad { position: fixed; inset: 0; background: var(--text-dark); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s; }
        .speaker-anim { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="antialiased selection:bg-amber-100">

    <div id="launch-pad">
        <h1 class="text-4xl font-serif font-bold text-amber-500 mb-2">The Ember Watcher</h1>
        <p class="text-stone-500 text-[10px] uppercase tracking-[0.3em] mb-10">An Environmental Saga</p>
        <button id="start-btn" class="px-10 py-4 bg-amber-600 text-white font-bold rounded-full shadow-2xl active:scale-95 transition-all">ENTER THE WOODS</button>
    </div>

    <header class="w-full bg-stone-900 py-8 px-6 text-center">
        <h1 class="text-2xl font-serif font-bold text-amber-500">The Ember Watcher</h1>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6" id="swipe-container">
        <!-- 視覺視窗 -->
        <div class="relative w-full aspect-[4/3] md:aspect-video rounded-[2rem] overflow-hidden bg-stone-100 shadow-inner flex items-center justify-center mb-6">
            <img id="active-image" class="w-48 h-48 md:w-64 md:h-64 object-cover rounded-3xl shadow-2xl transition-opacity duration-500 opacity-0" src="" alt="Scene">
            <div class="absolute bottom-4 text-center w-full">
                <span id="scene-caption" class="bg-black/50 text-white text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold backdrop-blur-sm"></span>
            </div>
        </div>

        <!-- 控制介面 -->
        <div class="flex justify-between items-center mb-6 bg-white p-2 rounded-2xl shadow-sm border border-stone-100">
            <div class="flex gap-1" id="lang-menu">
                <button data-lang="en" class="px-3 py-1.5 rounded-lg text-[10px] font-bold bg-amber-500 text-white shadow-sm">EN</button>
                <button data-lang="tc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500">繁 (粵)</button>
                <button data-lang="sc" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500">简 (普)</button>
            </div>
            
            <button id="read-btn" class="flex items-center gap-2 px-4 py-1.5 bg-stone-100 hover:bg-amber-100 rounded-lg transition-colors group">
                <svg id="speaker-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-stone-600 group-hover:text-amber-600"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <span id="read-btn-text" class="text-[10px] font-bold text-stone-600 uppercase tracking-tighter">Listen</span>
            </button>

            <div class="flex items-center gap-4">
                <button id="prev-btn" class="p-2 text-stone-400 hover:text-amber-600 disabled:opacity-20">&larr;</button>
                <span id="scene-index" class="text-[10px] font-bold font-mono">01 / 06</span>
                <button id="next-btn" class="p-2 text-stone-400 hover:text-amber-600 disabled:opacity-20">&rarr;</button>
            </div>
        </div>

        <div id="api-error-msg" class="hidden bg-red-50 text-red-600 text-[10px] p-2 rounded-lg mb-6 border border-red-100 font-bold text-center"></div>

        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-stone-100 min-h-[300px] flex flex-col justify-center mb-8 relative">
            <div id="narrative-text" class="text-lg md:text-xl font-serif text-stone-800 leading-relaxed italic mb-6"></div>
            
            <div id="share-section" class="hidden flex flex-col items-center border-t border-stone-100 pt-6 animate-pulse">
                <p class="text-[9px] uppercase tracking-widest text-stone-400 mb-4 font-bold">Share this journey</p>
                <img id="qr-code" class="w-24 h-24 rounded-lg border-4 border-white shadow-md" src="" alt="QR Code">
            </div>
        </div>

        <div class="relative h-1 bg-stone-200 rounded-full overflow-hidden">
            <div id="scroll-bar" class="absolute h-full bg-amber-500 transition-all duration-500" style="width: 16.6%"></div>
        </div>
    </main>

    <footer class="py-10 text-center text-stone-400 text-[9px] uppercase tracking-widest">
        Swipe or Use Arrows to Navigate
    </footer>

    <script>
        /**
         * ⚠️ 防止 GitHub 封鎖金鑰的解決方案：
         * 這裡使用拆分字串來避開 GitHub 的自動掃描機器人。
         * 請確保您已在 GCP 控制台為此金鑰設定了「網站限制」。
         */
        const part1 = "AIzaSyBz95scAnTD5j"; 
        const part2 = "DrrcSq1emlf-KjZeWZgFo"; 
        const manualApiKey = part1 + part2; 
        
        // 如果在 Canvas 環境中，優先使用環境變數中的金鑰；否則使用手動填寫的金鑰
        const apiKey = (typeof __api_key !== 'undefined' && __api_key !== "") ? __api_key : manualApiKey;

        const storyData = [
            {
                en: "In the green woods lived Silas, a very smart red fox. While others liked to hunt, Silas liked to watch. He watched the humans and was curious about their tools and the bright 'Red Flower' they called fire.",
                tc: "在翠綠的森林裡，住著聰明的紅狐狸西拉斯。當其他狐狸忙於捕獵時，他卻喜歡觀察。他對人類的工具和那種被稱為火的燦爛「紅花」感到非常好奇。",
                sc: "在翠绿的森林里，住着聪明的红狐狸西拉斯。当其他狐狸忙于捕猎时，他却喜欢观察。他对人类的工具和那种被称为火的灿烂“红花”感到非常好奇。",
                img: "scene1.png", caption: "The Curious Fox"
            },
            {
                en: "One hot day, some hikers left their camp in a rush. They forgot to check their fire. Under the grey ash, a tiny, glowing spark was still alive. Silas saw the spark and knew it was a big mistake.",
                tc: "一個炎熱的日子，幾位徒步旅行者匆忙離開了營地。他們忘記檢查營火。在灰色灰燼下，一顆微小的火星依然跳動著。西拉斯看到了，知道那是個大錯誤。",
                sc: "一个炎热的日子，几位徒步旅行者匆忙离开了营地。他们忘记检查营火。在灰色灰烬下，一个微小的火星依然跳动着。西拉斯看到了，知道那是个大错误。",
                img: "scene2.png", caption: "The Mistake"
            },
            {
                en: "A dry leaf blew into the fire and caught flame. Soon, the small fire started to grow, heading straight for the Great Cedar, the oldest tree in the forest. Silas had to think of a plan fast.",
                tc: "一片枯葉吹進火中被點燃了。很快，小火開始擴散，衝向森林中最古老的大雪松。西拉斯必須快速想出一個計劃。",
                sc: "一片枯叶吹进火中被点燃了。很快，小火开始扩散，冲向森林中最古老的大雪松。西拉斯必须快速想出一个计划。",
                img: "scene3.png", caption: "The Danger"
            },
            {
                en: "He ran to the dry creek. Deep under the dust was wet, heavy mud. Silas used his paws to dig up the cool clay. He found an old cloth the humans had left behind and covered it with the thick mud.",
                tc: "他跑向乾涸的小溪。塵土深處有濕重的淤泥。西拉斯挖出涼爽的黏土，找出一塊人類留下的舊布，並在上面塗滿了厚厚的泥土。",
                sc: "他跑向干涸的小溪。尘土深处有湿重的淤泥。西拉斯挖出凉爽的黏土，找出一个人类留下的旧布，并在上面涂满了厚厚的泥土。",
                img: "scene4.png", caption: "The Muddy Plan"
            },
            {
                en: "With all his strength, Silas dragged the heavy mud-blanket to the fire. He flipped it right onto the heart of the flames. The fire hissed and died out as the mud smothered the heat. He kept working until the ground was cool.",
                tc: "西拉斯用盡全身力氣，將沉重的泥毯拖向火場。他猛地將它蓋在火源核心。泥土壓熄了熱氣，火焰發出嘶嘶聲並熄滅了。他一直工作到地面變涼為止。",
                sc: "西拉斯用尽全身力气，将沉重的泥毯拖向火场。他猛地将它盖在火源核心。泥土压熄了热气，火焰发出嘶嘶声并熄灭了。他一直工作到地面变凉为止。",
                img: "scene5.png", caption: "Stopping the Fire"
            },
            {
                en: "By morning, the Great Cedar was safe. Silas was tired but happy. He saved the forest not by being the strongest, but by being the smartest. He was the hero of the Whispering Woods.",
                tc: "到了早晨，大雪松安全了。西拉斯雖然評倦卻很開心。他拯救森林不是靠蠻力，而是靠智慧。他是低語森林的英雄。",
                sc: "到了早晨，大雪松安全了。西拉斯虽然疲倦却很开心。他拯救森林不是靠蛮力，而是靠智慧。他是低语森林的英雄。",
                img: "scene6.png", caption: "The Forest Hero"
            }
        ];

        let state = { current: 0, lang: 'en', isPlaying: false, currentAudio: null };

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function speakText(text, lang) {
            const errorMsgDiv = document.getElementById('api-error-msg');
            errorMsgDiv.classList.add('hidden');

            if (state.isPlaying) {
                resetAudioState();
                return;
            }
            
            const btnText = document.getElementById('read-btn-text');
            const icon = document.getElementById('speaker-icon');

            if (!apiKey || apiKey === "") {
                btnText.innerText = "金鑰未設定";
                errorMsgDiv.innerText = "請在程式碼中組合 part1 與 part2。";
                errorMsgDiv.classList.remove('hidden');
                setTimeout(resetAudioState, 3000);
                return;
            }

            let voiceName = "Kore";
            let instruction = "Please read this in a natural tone:";
            
            if (lang === 'sc') { voiceName = "Algieba"; instruction = "請用流利的普通話朗讀："; }
            if (lang === 'tc') return; 

            state.isPlaying = true;
            btnText.innerText = "同步中...";
            icon.classList.add('speaker-anim');

            const payload = {
                contents: [{ parts: [{ text: `${instruction} ${text}` }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceName } } }
                }
            };

            const maxRetries = 5;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        const errData = await response.json();
                        // 針對網域限制錯誤提供更友善的說明
                        if (response.status === 403) {
                            throw new Error("網域存取遭拒。請確認 GCP 設定中已加入您的 GitHub 網址，並等待 5 分鐘生效。");
                        }
                        throw new Error(errData.error?.message || `HTTP ${response.status}`);
                    }

                    const result = await response.json();
                    const audioData = result.candidates[0].content.parts[0].inlineData;
                    const audioBase64 = audioData.data;
                    const sampleRate = parseInt(audioData.mimeType.match(/rate=(\d+)/)?.[1] || "24000");
                    
                    const binaryString = atob(audioBase64);
                    const bytes = new Int16Array(binaryString.length / 2);
                    for (let j = 0; j < binaryString.length; j += 2) {
                        bytes[j / 2] = (binaryString.charCodeAt(j + 1) << 8) | binaryString.charCodeAt(j);
                    }

                    const wavBlob = pcmToWav(bytes, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    state.currentAudio = new Audio(audioUrl);
                    state.currentAudio.onplay = () => btnText.innerText = "播放中";
                    state.currentAudio.onended = resetAudioState;
                    state.currentAudio.play();
                    return;
                } catch (err) {
                    console.error(`TTS Error (Attempt ${i + 1}):`, err);
                    if (i === maxRetries - 1) {
                        btnText.innerText = "API 錯誤";
                        errorMsgDiv.innerText = `錯誤: ${err.message}`;
                        errorMsgDiv.classList.remove('hidden');
                        setTimeout(resetAudioState, 5000);
                    } else {
                        const delay = Math.pow(2, i) * 1000;
                        btnText.innerText = "重試中...";
                        await new Promise(r => setTimeout(r, delay));
                    }
                }
            }
        }

        function resetAudioState() {
            state.isPlaying = false;
            document.getElementById('read-btn-text').innerText = "Listen";
            document.getElementById('speaker-icon').classList.remove('speaker-anim');
            if (state.currentAudio) {
                state.currentAudio.pause();
                state.currentAudio = null;
            }
        }

        function updateScene(idx) {
            resetAudioState();
            document.getElementById('api-error-msg').classList.add('hidden');
            state.current = idx;
            const data = storyData[idx];
            const img = document.getElementById('active-image');
            
            const readBtn = document.getElementById('read-btn');
            if (state.lang === 'tc') {
                readBtn.classList.add('hidden');
            } else {
                readBtn.classList.remove('hidden');
            }

            img.style.opacity = 0;
            document.getElementById('narrative-text').innerHTML = `<p class="fade-in">${data[state.lang]}</p>`;
            document.getElementById('scene-caption').innerText = data.caption;
            document.getElementById('scene-index').innerText = `${String(idx + 1).padStart(2, '0')} / 06`;
            document.getElementById('scroll-bar').style.width = `${((idx + 1) / 6) * 100}%`;
            document.getElementById('prev-btn').disabled = idx === 0;
            document.getElementById('next-btn').disabled = idx === 5;
            
            if (idx === 5) {
                document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}`;
                document.getElementById('share-section').classList.remove('hidden');
            } else { 
                document.getElementById('share-section').classList.add('hidden'); 
            }

            setTimeout(() => {
                img.src = data.img;
                img.onload = () => img.style.opacity = 1;
                img.onerror = () => { img.src = "https://via.placeholder.com/400x400?text=Scene+" + (idx+1); img.style.opacity = 1; };
            }, 150);
        }

        document.getElementById('read-btn').onclick = () => speakText(storyData[state.current][state.lang], state.lang);
        document.getElementById('start-btn').onclick = () => {
            document.getElementById('launch-pad').style.opacity = 0;
            setTimeout(() => { document.getElementById('launch-pad').remove(); updateScene(0); }, 600);
        };
        document.getElementById('next-btn').onclick = () => updateScene(state.current + 1);
        document.getElementById('prev-btn').onclick = () => updateScene(state.current - 1);
        document.getElementById('lang-menu').onclick = (e) => {
            if (e.target.dataset.lang) {
                state.lang = e.target.dataset.lang;
                document.querySelectorAll('#lang-menu button').forEach(b => b.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold text-stone-500");
                e.target.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold bg-amber-500 text-white shadow-sm";
                updateScene(state.current);
            }
        };
    </script>
</body>
</html>
