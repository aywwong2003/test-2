<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ember Watcher - A Forest Tale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Bubblegum+Sans&display=swap');
        body { background-color: #f0f7f4; color: #2d3436; font-family: 'Quicksand', sans-serif; }
        .font-bubble { font-family: 'Bubblegum Sans', cursive; }
        .story-card { background: white; border: 4px solid #e2e8f0; border-radius: 3rem; box-shadow: 0 12px 0 0 #cbd5e1; }
        .nav-btn { background: white; border: 3px solid #e2e8f0; box-shadow: 0 5px 0 0 #cbd5e1; transition: all 0.2s; }
        .nav-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 0 #cbd5e1; }
        #launch-pad { position: fixed; inset: 0; background: #2d5a27; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
    </style>
</head>
<body class="antialiased">

    <div id="launch-pad">
        <div class="text-6xl mb-6">🦊</div>
        <h1 class="text-4xl font-bubble text-white mb-10">The Ember Watcher</h1>
        <button id="start-btn" class="px-12 py-5 bg-orange-400 text-white font-black text-xl rounded-full shadow-[0_8px_0_0_#c2410c] hover:scale-105 active:translate-y-1 active:shadow-none transition-all">
            READ THE STORY
        </button>
    </div>

    <header class="w-full bg-emerald-800 py-8 text-center shadow-lg">
        <h1 class="text-3xl font-bubble text-orange-300">The Ember Watcher</h1>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
            <div class="relative aspect-square rounded-[3rem] overflow-hidden bg-white border-8 border-white shadow-2xl">
                <img id="active-image" class="w-full h-full object-cover transition-opacity duration-500" src="" alt="Story Art">
                <div class="absolute bottom-6 left-6 right-6">
                    <div class="bg-white/90 px-6 py-2 rounded-2xl shadow-lg border-2 border-emerald-100 text-center">
                        <p id="scene-caption" class="text-emerald-900 font-bold text-xs uppercase tracking-widest"></p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col space-y-6">
                <div class="flex justify-between items-center">
                    <div class="flex bg-emerald-100 p-1 rounded-xl" id="lang-menu">
                        <button data-lang="en" class="px-4 py-2 rounded-lg text-xs font-bold bg-white shadow-sm">EN</button>
                        <button data-lang="tc" class="px-4 py-2 rounded-lg text-xs font-bold">繁</button>
                    </div>
                    <div class="flex items-center gap-4">
                        <button id="prev-btn" class="nav-btn w-12 h-12 rounded-xl text-emerald-800 font-bold">←</button>
                        <span id="scene-index" class="font-bubble text-emerald-800">01 / 06</span>
                        <button id="next-btn" class="nav-btn w-12 h-12 rounded-xl text-emerald-800 font-bold">→</button>
                    </div>
                </div>
                <div class="story-card p-10 min-h-[350px] flex items-center">
                    <div id="narrative-text" class="text-xl text-stone-700 leading-relaxed font-medium"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const storyData = [
            {
                en: "In the Whispering Woods lived Silas the fox. He was fascinated by the clicking boxes that birthed 'The Red Flower'.",
                tc: "在低語森林中住著狐狸西拉斯。他著迷於那些能孕育出「紅花」的咔噠盒子。",
                img: "https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&q=80&w=800",
                caption: "Silas the Observer"
            },
            {
                en: "A circle of stones was left behind. Deep in the ash, a single ember pulsed like a heartbeat.",
                tc: "一圈石頭被留在了原地。在灰燼深處，一顆餘燼像心臟般跳動。",
                img: "https://images.unsplash.com/photo-1544256718-3bcf237f3974?auto=format&fit=crop&q=80&w=800",
                caption: "The Tiny Secret"
            },
            {
                en: "The forest was dry. A small orange tongue of flame began licking at pine needles.",
                tc: "森林很乾燥。一小條橙色的火舌開始舔食松針。",
                img: "https://images.unsplash.com/photo-1580974511812-4b7197050a3b?auto=format&fit=crop&q=80&w=800",
                caption: "The Growing Flower"
            },
            {
                en: "Silas dashed to the creek and dug through the dust to find damp clay.",
                tc: "西拉斯衝向小溪，挖開塵土尋找濕潤的黏土。",
                img: "https://images.unsplash.com/photo-1543393169-29e92404975d?auto=format&fit=crop&q=80&w=800",
                caption: "The Clever Plan"
            },
            {
                en: "With a powerful leap, he smothered the fire's heart with the wet earth.",
                tc: "伴隨奮力一跳，他用濕土悶熄了火焰的核心。",
                img: "https://images.unsplash.com/photo-1462212210333-335063b676bc?auto=format&fit=crop&q=80&w=800",
                caption: "The Hero's Leap"
            },
            {
                en: "By dawn, the woods were safe. Silas saved the forest with a clever plan.",
                tc: "黎明時分，森林平安無事。西拉斯用聰明的計劃拯救了家園。",
                img: "https://images.unsplash.com/photo-1448375232540-44afc0c533f3?auto=format&fit=crop&q=80&w=800",
                caption: "The Forest Savior"
            }
        ];

        let current = 0;
        let lang = 'en';

        function render() {
            const data = storyData[current];
            document.getElementById('active-image').src = data.img;
            document.getElementById('narrative-text').innerText = data[lang];
            document.getElementById('scene-caption').innerText = data.caption;
            document.getElementById('scene-index').innerText = `${current + 1} / 06`;
            document.getElementById('prev-btn').disabled = current === 0;
            document.getElementById('next-btn').disabled = current === 5;
        }

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('launch-pad').style.opacity = '0';
            setTimeout(() => document.getElementById('launch-pad').remove(), 500);
            render();
        };

        document.getElementById('next-btn').onclick = () => { current++; render(); };
        document.getElementById('prev-btn').onclick = () => { current--; render(); };
        document.getElementById('lang-menu').onclick = (e) => {
            if (e.target.dataset.lang) {
                lang = e.target.dataset.lang;
                document.querySelectorAll('#lang-menu button').forEach(b => b.classList.remove('bg-white', 'shadow-sm'));
                e.target.classList.add('bg-white', 'shadow-sm');
                render();
            }
        };
    </script>
</body>
</html>
