<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fable Forest - Choose Your Story</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=Inter:wght@400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .font-serif {
            font-family: 'Crimson Pro', serif;
        }

        .story-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .story-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/01/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2394a3b8' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2v-4h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2v-4h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .fade-in {
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-6">

    <div class="max-w-6xl w-full">
        <!-- Header -->
        <header class="text-center mb-16 fade-in">
            <h1 class="text-5xl md:text-6xl font-serif font-bold text-slate-900 mb-4">Fable Forest</h1>
            <p class="text-slate-600 text-lg md:text-xl max-w-2xl mx-auto">
                Step into a world of wonder. Which path will you take today?
            </p>
        </header>

        <!-- Story Selection Grid -->
        <div id="story-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 fade-in" style="animation-delay: 0.2s;">
            <!-- Content generated via JavaScript -->
        </div>

        <!-- Footer -->
        <footer class="mt-20 text-center text-slate-400 text-sm">
            <p>© 2024 Fable Forest Story Collection</p>
        </footer>
    </div>

    <!-- Load the catalog script -->
    <script src="catalog.js"></script>
    <script>
        // Define color mapping for Tailwind
        const colorClasses = {
            amber: { bg: 'bg-amber-100', btn: 'bg-amber-500 hover:bg-amber-600 shadow-amber-200/50', accent: '#f59e0b' },
            sky: { bg: 'bg-sky-100', btn: 'bg-sky-500 hover:bg-sky-600 shadow-sky-200/50', accent: '#0ea5e9' },
            emerald: { bg: 'bg-emerald-100', btn: 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-200/50', accent: '#10b981' },
            rose: { bg: 'bg-rose-100', btn: 'bg-rose-500 hover:bg-rose-600 shadow-rose-200/50', accent: '#f43f5e' },
            violet: { bg: 'bg-violet-100', btn: 'bg-violet-500 hover:bg-violet-600 shadow-violet-200/50', accent: '#8b5cf6' }
        };

        function renderGrid() {
            const grid = document.getElementById('story-grid');
            if (typeof storyCatalog === 'undefined') {
                grid.innerHTML = '<p class="text-center col-span-full text-slate-400">Loading stories...</p>';
                return;
            }

            grid.innerHTML = storyCatalog.map((story, index) => {
                const theme = colorClasses[story.color] || colorClasses.amber;
                return `
                    <div class="story-card bg-white rounded-3xl overflow-hidden border border-slate-200 flex flex-col fade-in" style="animation-delay: ${0.1 * (index + 1)}s">
                        <div class="h-48 ${theme.bg} flex items-center justify-center relative overflow-hidden">
                            <div class="absolute inset-0 opacity-20 pointer-events-none">
                                <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                                    <path d="M0,100 C30,80 70,80 100,100 L100,0 L0,0 Z" fill="${theme.accent}"></path>
                                </svg>
                            </div>
                            <span class="text-7xl relative z-10">${story.emoji}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h2 class="text-2xl font-serif font-bold text-slate-800 mb-2">${story.title}</h2>
                            <p class="text-slate-600 mb-6 flex-grow leading-relaxed text-sm">
                                ${story.description}
                            </p>
                            <a href="reader.html?story=${story.id}" class="block w-full text-center ${theme.btn} text-white font-bold py-3 px-4 rounded-xl transition-colors duration-200 shadow-lg">
                                Start Adventure
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initialize grid on load
        window.addEventListener('DOMContentLoaded', renderGrid);
    </script>
</body>
</html>
